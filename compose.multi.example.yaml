# Multi-server example. Copy to compose.yaml, then edit servers.yaml separately
# (see servers.example.yaml for the format).
#
#   cp compose.multi.example.yaml compose.yaml
#   cp servers.example.yaml servers.yaml      # edit for your hosts
#   cp .env.example .env                      # edit for your passwords
#   docker compose up --build -d

services:
  ipmi-dashboard:
    build: .
    image: ipmi-dashboard:latest
    container_name: ipmi-dashboard
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - SERVERS_CONFIG=/app/servers.yaml
      - WEB_PORT=8080
    env_file:
      - .env
    volumes:
      - ./servers.yaml:/app/servers.yaml:ro
      - ./data:/app/data
